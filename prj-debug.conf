# Debug overlay: re-enables what the production build (prj.conf) strips.
#
# Use:
#   west build -s ~/work/pwr-logger -b promicro_nrf52840/nrf52840 \
#       -d /tmp/pwrlog-debug --sysbuild \
#       -- -DCONFIG_APP_BRINGUP=n -DEXTRA_CONF_FILE=prj-debug.conf
#
# Cost vs production build (measured 2026-05-28):
#   RAM:    85.80% -> 95.57%   (+25 KB: log queue, RTT up-buf, log
#                               thread, analyzer state)
#   FLASH:  52.74% -> 61.58%   (+42 KB: log format strings, RTT, helpers)
# Download throughput unaffected at this RAM level; the SD double-buffer
# at 16 KB/chunk still fits with ~5% headroom.

CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_BUFFER_SIZE=4096
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048

# Thread stack high-water + auto-print every 20 s.
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=20

# Per-thread fault dump (PC/LR/SP + register file) before the offender
# aborts. Without this, a single-thread fault leaves no trace beyond
# the thread disappearing from the iterator.
CONFIG_EXCEPTION_DEBUG=y
