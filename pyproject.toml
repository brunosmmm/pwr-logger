[project]
name = "pwr-logger-tools"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "bleak>=3.1.0",
    "cbor2>=6.2.1",
    "nptdms>=1.13.0",
    "numpy>=2.2.6",
    "pyserial>=3.5",
    "pyusb>=1.3.1",
    "rich>=15.0.0",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.10.9",
]

[tool.uv]
package = false
