# Standalone bring-up build profile (NO MCUboot): links the app at 0x0 so it
# boots directly over SWD, for Phase 0/1 hardware bring-up.
#
# Use WITHOUT --sysbuild:
#   west build -b promicro_nrf52840/nrf52840 -- -DEXTRA_CONF_FILE=bringup.conf
#
# The board otherwise targets an MCUboot scheme (zephyr,code-partition=slot0 and
# a 0x1000 MBR offset); these two overrides bypass that for direct boot.
CONFIG_USE_DT_CODE_PARTITION=n
CONFIG_FLASH_LOAD_OFFSET=0
