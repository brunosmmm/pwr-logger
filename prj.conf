# pwr-logger application Kconfig.
# NOTE: this is a starting point. Several storage/DFU symbol names are
# Zephyr-version-sensitive — expect to adjust on the first `west build`.
# See REQUIREMENTS.md / IMPLEMENTATION.md for the rationale behind each group.

# ---- Core ----------------------------------------------------------------
# Logging + RTT disabled: ~17-22 KB BSS reclaim for download buffers.
# Trade: no boot diagnostics, no LOG_INF/WRN/ERR, fault dumps invisible
# without re-flashing a debug build (separate prj-debug.conf can re-enable).
# LOG_MODULE_REGISTER calls in driver/app code compile to no-ops under
# CONFIG_LOG=n; runtime is unaffected.
CONFIG_LOG=n
CONFIG_FPU=y
CONFIG_GPIO=y
CONFIG_GPIO_HOGS=y     # drive P0.13 high at boot to keep the board's 3.3V rail on
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_REBOOT=y
CONFIG_POWEROFF=y      # sys_poweroff() for SHIP / System OFF
# Hardware watchdog: nRF WDT, 4s timeout, fed by sysworkq every 1s.
# Catches kernel-level deadlocks (sysworkq stops -> SoC reset) without
# false positives in normal operation. See src/wdt.c for the full design.
CONFIG_WATCHDOG=y
# Enable board_early_init_hook() in src/board_init.c -- writes UICR.REGOUT0 =
# 3.3 V on first boot in HV mode. Without this Kconfig, hooks.h expands the
# call site to do-while-0 and the hook is dead code, leaving VDD = 1.8 V.
CONFIG_BOARD_EARLY_INIT_HOOK=y

# ---- Acquisition: nrfx SAADC + TIMER + PPI (gapless 200 kSPS hot path) ----
# Driver classes; the specific TIMER/SAADC instances are enabled via devicetree
# (e.g. &timer2, &adc status = "okay") when acquisition.c is implemented.
CONFIG_NRFX_SAADC=y
CONFIG_NRFX_TIMER=y
CONFIG_NRFX_GPPI=y
CONFIG_NRFX_GPIOTE=y

# ---- Precision channel: INA228 over I2C (Fast-mode-plus) ------------------
CONFIG_I2C=y

# ---- Storage: SD over SPI + FatFs/exFAT ----------------------------------
CONFIG_SPI=y
CONFIG_DISK_ACCESS=y
CONFIG_SDHC=y
CONFIG_SDMMC_STACK=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_EXFAT=y
CONFIG_FS_FATFS_LFN=y
# FatFs has zero internal locking by default; with the FILE-page render
# now calling fs_statvfs / fs_stat from the display thread (priority 8)
# while the logger writer (priority 5) does fs_write, an unsynchronized
# access wedges the global FF state and freezes the device. Reentrant
# mode wraps every FS call in a Zephyr mutex (~120 B BSS).
CONFIG_FS_FATFS_REENTRANT=y

# ---- BLE: aggregated live stream + DFU transport -------------------------
CONFIG_BT=y
CONFIG_BT_LL_SW_SPLIT=y     # Zephyr's open-source link-layer controller (no blob)
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="pwr-logger"
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251

# ---- USB: composite CDC console + MSC offload (device_next) ----------------
# Own a single composite USB device (CDC console + MSC) in usb_msc.c: disable
# the board's standalone CDC-ACM-console context so MSC can share the device.
# MSC exposes the SD card (disk-name "SD") to a host; mutually exclusive with
# FatFs logging (host owns the block device during offload).
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_USBD_MSC_CLASS=y
CONFIG_HWINFO=y
# Push CDC TX throughput closer to the FS bulk-EP limit. Default pool is
# 16 x 64 B = 1 KB shared with MSC/desc; that caps us at ~1 packet per
# host SOF -> ~85 KB/s. A dedicated pool with more buffers lets the UDC
# pre-stage multiple packets so the host can drain them per-frame.
CONFIG_USBD_CDC_ACM_BUF_POOL=y
CONFIG_UDC_BUF_COUNT=32
# Shared by CDC ACM + MSC + pwr-bulk. The pwr-bulk class can have up to
# PWR_BULK_BUF_COUNT (8) * 1024 B = 8 KB of transfers outstanding when
# the producer races ahead of the host; 16 KB leaves the pool large
# enough to absorb that without back-pressuring CDC/MSC alloc paths.
# pwr-bulk's producer also retries on alloc-fail so a too-small pool is
# a perf hit, not a correctness bug.
CONFIG_UDC_BUF_POOL_SIZE=32768

# ---- Persistent config: Zephyr settings over NVS (the 'storage' partition) -
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y

# ---- Console shell over the CDC-ACM USB console (chosen zephyr,shell-uart) --
# Input command surface for config/time/logctl. Logs stay on the RTT backend so
# the interactive shell isn't cluttered (SHELL_LOG_BACKEND=n).
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_LOG_BACKEND=n
# Default 2 KB shell stack overflows when 'pwr download' opens a FatFs file
# and streams bytes via uart_poll_out -- FatFs read + console_dev struct
# accesses through that path use enough stack to tip over. 4 KB clears it
# with headroom; observed peak ~1.6 KB during a multi-MB download.
CONFIG_SHELL_STACK_SIZE=4096

# ---- Dev: thread analyzer disabled (CONFIG_LOG=n, no sink for its output) --
# CONFIG_THREAD_NAME=y / THREAD_MONITOR=y / THREAD_ANALYZER* removed alongside
# the log subsystem. EXCEPTION_DEBUG also relied on log/printk for output;
# faults now just reset the board via the default fatal handler. Re-enable
# this whole block in a debug build if you need crash visibility or thread
# stack high-water analysis.

# ---- Optional OLED status display ------------------------------------------
CONFIG_APP_DISPLAY=y

# ---- OTA: MCUboot image infra (bootloader enabled in sysbuild.conf) --------
# Slot / image-management plumbing (used by both BLE OTA and SD-card update).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
# mcumgr (BLE/USB SMP transport) is deferred: it needs extra deps (zcbor,
# net_buf, crc, base64) + handler registration. Enable when implementing OTA.
# CONFIG_MCUMGR=y
# CONFIG_MCUMGR_TRANSPORT_BT=y
# CONFIG_MCUMGR_GRP_IMG=y
# CONFIG_MCUMGR_GRP_OS=y
