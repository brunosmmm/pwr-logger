# pwr-logger application Kconfig.
# NOTE: this is a starting point. Several storage/DFU symbol names are
# Zephyr-version-sensitive — expect to adjust on the first `west build`.
# See REQUIREMENTS.md / IMPLEMENTATION.md for the rationale behind each group.

# ---- Core ----------------------------------------------------------------
CONFIG_LOG=y
CONFIG_FPU=y
CONFIG_GPIO=y
CONFIG_GPIO_HOGS=y     # drive P0.13 high at boot to keep the board's 3.3V rail on
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_REBOOT=y
CONFIG_POWEROFF=y      # sys_poweroff() for SHIP / System OFF
# Logs go to the RTT backend (over SWD) AND the board's auto-enabled USB-CDC
# console — view whichever is convenient during bring-up.
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_BUFFER_SIZE=4096

# ---- Acquisition: nrfx SAADC + TIMER + PPI (gapless 200 kSPS hot path) ----
# Driver classes; the specific TIMER/SAADC instances are enabled via devicetree
# (e.g. &timer2, &adc status = "okay") when acquisition.c is implemented.
CONFIG_NRFX_SAADC=y
CONFIG_NRFX_TIMER=y
CONFIG_NRFX_GPPI=y
CONFIG_NRFX_GPIOTE=y

# ---- Precision channel: INA228 over I2C (Fast-mode-plus) ------------------
CONFIG_I2C=y

# ---- Storage: SD over SPI + FatFs/exFAT ----------------------------------
CONFIG_SPI=y
CONFIG_DISK_ACCESS=y
CONFIG_SDHC=y
CONFIG_SDMMC_STACK=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_EXFAT=y
CONFIG_FS_FATFS_LFN=y

# ---- BLE: aggregated live stream + DFU transport -------------------------
CONFIG_BT=y
CONFIG_BT_LL_SW_SPLIT=y     # Zephyr's open-source link-layer controller (no blob)
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="pwr-logger"
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251

# ---- USB: composite CDC console + MSC offload (device_next) ----------------
# Own a single composite USB device (CDC console + MSC) in usb_msc.c: disable
# the board's standalone CDC-ACM-console context so MSC can share the device.
# MSC exposes the SD card (disk-name "SD") to a host; mutually exclusive with
# FatFs logging (host owns the block device during offload).
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_USBD_MSC_CLASS=y
CONFIG_HWINFO=y

# ---- Persistent config: Zephyr settings over NVS (the 'storage' partition) -
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y

# ---- Console shell over the CDC-ACM USB console (chosen zephyr,shell-uart) --
# Input command surface for config/time/logctl. Logs stay on the RTT backend so
# the interactive shell isn't cluttered (SHELL_LOG_BACKEND=n).
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_LOG_BACKEND=n

# ---- OTA: MCUboot image infra (bootloader enabled in sysbuild.conf) --------
# Slot / image-management plumbing (used by both BLE OTA and SD-card update).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
# mcumgr (BLE/USB SMP transport) is deferred: it needs extra deps (zcbor,
# net_buf, crc, base64) + handler registration. Enable when implementing OTA.
# CONFIG_MCUMGR=y
# CONFIG_MCUMGR_TRANSPORT_BT=y
# CONFIG_MCUMGR_GRP_IMG=y
# CONFIG_MCUMGR_GRP_OS=y
